
<!DOCTYPE html>
<html>
<head>
    <title>Customer Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Pravallika Courier Services</h1>
    <p>Customer Management</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="customers.html">Customers</a>
    <a href="parcels.html">Parcels</a>
    <a href="payments.html">Payments</a>
    <a href="tracking.html">Tracking</a>
</nav>

<div class="container">

    <h2>Customer Details</h2>

    <form id="customerForm">

        <input type="hidden" id="customer_id">

        <label>Customer Name</label>
        <input type="text" id="name" placeholder="Enter customer name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email" required>

        <label>Phone</label>
        <input type="text" id="phone" placeholder="Enter phone number" required>

        <label>Address</label>
        <textarea id="address" placeholder="Enter address" required></textarea>

        <button type="submit">Save Customer</button>
        <button type="reset" onclick="clearForm()">Clear</button>

    </form>

    <h2>Search Customer</h2>

    <input type="text" id="search" placeholder="Search by name or customer ID" onkeyup="searchCustomer()">

    <h2>Customer List</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="customerTable">
        </tbody>
    </table>

</div>

<footer>
    <p>© 2026 Pravallika Courier Services</p>
</footer>

<script>

async function loadCustomers() {
    const response = await fetch('/api/customers');
    const customers = await response.json();

    const table = document.getElementById('customerTable');
    table.innerHTML = '';

    customers.forEach(c => {
        table.innerHTML += `
            <tr>
                <td>${c.customer_id}</td>
                <td>${c.name}</td>
                <td>${c.email}</td>
                <td>${c.phone}</td>
                <td>${c.address}</td>
                <td>
                    <button onclick="editCustomer(${c.customer_id}, '${encodeURIComponent(c.name)}', '${encodeURIComponent(c.email)}', '${encodeURIComponent(c.phone)}', '${encodeURIComponent(c.address)}')">Edit</button>
                    <button onclick="deleteCustomer(${c.customer_id})">Delete</button>
                </td>
            </tr>
        `;
    });
}

document.getElementById('customerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const id = document.getElementById('customer_id').value;

    const customer = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value
    };

    const url = id ? '/api/customers/' + id : '/api/customers';
    const method = id ? 'PUT' : 'POST';

    const response = await fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(customer)
    });

    const result = await response.json();
    alert(result.message);

    clearForm();
    loadCustomers();
});

function editCustomer(id, name, email, phone, address) {
    document.getElementById('customer_id').value = id;
    document.getElementById('name').value = decodeURIComponent(name);
    document.getElementById('email').value = decodeURIComponent(email);
    document.getElementById('phone').value = decodeURIComponent(phone);
    document.getElementById('address').value = decodeURIComponent(address);
    window.scrollTo(0, 0);
}

async function deleteCustomer(id) {
    if (confirm('Are you sure you want to delete this customer?')) {
        const response = await fetch('/api/customers/' + id, {
            method: 'DELETE'
        });

        const result = await response.json();
        alert(result.message);
        loadCustomers();
    }
}

function searchCustomer() {
    const value = document.getElementById('search').value.toLowerCase();

    document.querySelectorAll('#customerTable tr').forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(value) ? '' : 'none';
    });
}

function clearForm() {
    document.getElementById('customer_id').value = '';
}

loadCustomers();

</script>

</body>
</html>
